name: Collector release

# A tag with the collector's prefix is the only thing that releases the collector. The panel has
# its own prefix, panel/v*, so releasing either never releases the other.
on:
  push:
    tags: ['collector/v*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/randax/navimow-collector

jobs:
  # What needs nothing built, and stops a release before anything is published.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=${GITHUB_REF_NAME#collector/v}" >> "$GITHUB_OUTPUT"
      - name: No release without its changelog entry
        run: tools/release-notes.sh collector/CHANGELOG.md "$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      # The package index refuses a package that depends on a URL, and by then the image would
      # be out under this version.
      - name: No dependency on a URL
        run: |
          if grep -nE '^ *"[^"]+ @ ' collector/pyproject.toml; then
            echo "::error::pyproject.toml depends on a URL, which the package index refuses: depend on a released version instead"
            exit 1
          fi

  # The tests, the package and the image, as on every pull request. The package must carry the
  # version in the tag.
  checks:
    needs: prepare
    uses: ./.github/workflows/collector.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  # The image first: a tag on it can be pushed again, a version on the package index cannot.
  image:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: collector
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}
            ${{ env.IMAGE }}:latest

  # Trusted publishing: the package index takes this workflow's word for who it is, so there is
  # no token to keep. See the README for the one-off setup.
  pypi:
    needs: image
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: collector-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [prepare, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: collector-dist
          path: dist
      - name: Publish
        run: |
          tools/release-notes.sh collector/CHANGELOG.md "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Collector $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            dist/* collector/navimow-collector.service collector/navimow-collector.example.toml
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ github.token }}
