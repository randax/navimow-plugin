name: Collector

on:
  # Branches only: a tag's push is the release's to answer, and it runs all of this itself.
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Each night: a database image that changed under the matrix is found here, and not by
    # whoever opens the next pull request.
    - cron: "17 3 * * *"
  workflow_call:
    inputs:
      version:
        description: The version being released, which the package built here must then carry
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          # No password: a throwaway service reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      NAVIMOW_TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e 'collector[dev]'
      - run: ruff check collector
      - run: ruff format --check collector
      - run: mypy
        working-directory: collector
      - run: pytest collector

  # Every backend the collector writes to, asked the same where they differ. Not on every
  # push, which runs the replay suite against PostgreSQL: before a merge, each night, and
  # for a release.
  conformance:
    if: github.event_name != 'push' || inputs.version != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            image: postgres:16
            port: 5432
            healthy: pg_isready -U postgres
            variable: NAVIMOW_TEST_POSTGRES_DSN
            address: postgresql://postgres@localhost:5432/postgres
          - backend: timescaledb
            image: timescale/timescaledb:latest-pg16
            port: 5432
            healthy: pg_isready -U postgres
            variable: NAVIMOW_TEST_TIMESCALE_DSN
            address: postgresql://postgres@localhost:5432/postgres
          # A release line, not the latest: ClickHouse has no tag that follows its
          # long-term releases.
          - backend: clickhouse
            image: clickhouse/clickhouse-server:26.8
            port: 8123
            healthy: clickhouse-client --query 'SELECT 1'
            variable: NAVIMOW_TEST_CLICKHOUSE_URL
            address: http://default@localhost:8123
          # InfluxDB's three lines: the first by the older way in, the others by the newer.
          - backend: influxdb1
            image: influxdb:1.11
            port: 8086
            healthy: curl -sf http://localhost:8086/ping
            variable: NAVIMOW_TEST_INFLUXDB1_URL
            address: http://navimow:conformance@localhost:8086
          - backend: influxdb2
            image: influxdb:2.7
            port: 8086
            healthy: influx ping
            variable: NAVIMOW_TEST_INFLUXDB2_URL
            address: http://localhost:8086?org=home&token=conformance
          - backend: influxdb3
            image: influxdb:3-core
            port: 8181
            healthy: curl -sf http://localhost:8181/health
            variable: NAVIMOW_TEST_INFLUXDB3_URL
            address: http://localhost:8181?org=home
    services:
      database:
        image: ${{ matrix.image }}
        env:
          # No password, or one that is no secret, for whichever of them this is: a
          # throwaway service reachable only from this job. Each image reads its own.
          POSTGRES_HOST_AUTH_METHOD: trust
          CLICKHOUSE_SKIP_USER_SETUP: "1"
          INFLUXDB_HTTP_AUTH_ENABLED: "true"
          INFLUXDB_ADMIN_USER: navimow
          INFLUXDB_ADMIN_PASSWORD: conformance
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: navimow
          DOCKER_INFLUXDB_INIT_PASSWORD: conformance
          DOCKER_INFLUXDB_INIT_ORG: home
          DOCKER_INFLUXDB_INIT_BUCKET: navimow
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: conformance
          INFLUXDB3_NODE_IDENTIFIER_PREFIX: conformance
          INFLUXDB3_OBJECT_STORE: memory
          INFLUXDB3_START_WITHOUT_AUTH: "true"
        options: >-
          --health-cmd "${{ matrix.healthy }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
    env:
      # The backend this job is for must be there: without it the job fails, where any other
      # run of the suite skips a backend it cannot reach.
      NAVIMOW_TEST_REQUIRE: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e 'collector[dev]'
      - run: echo "$VARIABLE=$ADDRESS" >> "$GITHUB_ENV"
        env:
          VARIABLE: ${{ matrix.variable }}
          ADDRESS: ${{ matrix.address }}
      # By what each test needs, not by its name: one named without its backend would be
      # run by no job at all.
      - run: pytest collector/tests/test_conformance.py -m "$BACKEND" -rs
        env:
          BACKEND: ${{ matrix.backend }}

  # What a release publishes, short of publishing it, so that a tag is never the first time
  # either is built.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install build twine
      - run: collector/scripts/package.sh "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: collector-dist
          path: collector/dist/
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: collector/scripts/smoke.sh
