name: Collector

on:
  # Branches only: a tag's push is the release's to answer, and it runs all of this itself.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: The version being released, which the package built here must then carry
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          # No password: a throwaway service reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      NAVIMOW_TEST_POSTGRES_DSN: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e 'collector[dev]'
      - run: ruff check collector
      - run: ruff format --check collector
      - run: mypy
        working-directory: collector
      - run: pytest collector

  # What a release publishes, short of publishing it, so that a tag is never the first time
  # either is built.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install build twine
      - run: collector/scripts/package.sh "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: collector-dist
          path: collector/dist/
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: collector/scripts/smoke.sh
