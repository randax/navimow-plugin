[storage]
# "postgres", which is TimescaleDB's too; "clickhouse", with a dsn such as
# http://user:password@clickhouse:8123/navimow; or "influxdb", with one such as
# http://user:password@influxdb:8086/navimow or http://influxdb:8086/navimow?org=home&token=...
backend = "postgres"
# dsn = "postgresql://user:password@localhost/navimow"
dsn_file = "/run/secrets/navimow-postgres-dsn"
migrate = true
# Days of positions, progress, states and gaps to keep; unset keeps everything. Jobs are
# always kept.
# retention_days = 365

[auth]
# The public Home Assistant OAuth client needs no developer registration.
client_id = "homeassistant"
# client_secret_file = "/run/secrets/navimow-oauth-client-secret"
# state_file = "/var/lib/navimow-collector/tokens.json"

[collector]
# Holds the outage buffer and the note of when the stream last flowed.
# state_dir = "/var/lib/navimow-collector"

[health]
# Where `collect` serves /health and /metrics; "" serves neither. Use 0.0.0.0:9477 for a
# scraper on another host or container.
listen = "127.0.0.1:9477"
