[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navimow-collector"
version = "0.1.0"
description = "Collector recording Navimow mower Trails into a database"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "randax-navimow-sdk @ git+https://github.com/randax/navimow-sdk@v0.5.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
navimow-collector = "navimow_collector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/navimow_collector"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src", "tests"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["mower_sdk.*"]
ignore_missing_imports = true
